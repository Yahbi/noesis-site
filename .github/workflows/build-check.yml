# index.html, 404.html, the 24 route pages and bundle.js are generated by
# build.sh but committed, because GitHub Pages serves this branch directly.
# Nothing otherwise stops source and artifacts drifting apart, which ships a
# stale site that looks fine in the diff. This rebuilds and fails on any change.
name: build-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install pinned Babel
        run: npm ci --no-audit --no-fund

      - name: Rebuild with the committed cache-bust stamp
        run: |
          BUILD_V=$(grep -oE 'bundle\.js\?v=[0-9]+' index.html | head -1 | grep -oE '[0-9]+')
          if [ -z "$BUILD_V" ]; then echo "could not read committed ?v= stamp"; exit 1; fi
          echo "rebuilding with BUILD_V=$BUILD_V"
          BUILD_V="$BUILD_V" ./build.sh

      - name: Fail if generated files drifted from source
        run: |
          if ! git diff --exit-code --stat; then
            echo ""
            echo "Generated files do not match source."
            echo "Run ./build.sh locally and commit the result."
            exit 1
          fi
          echo "artifacts match source"

      - name: Syntax-check the bundle
        run: node --check bundle.js
