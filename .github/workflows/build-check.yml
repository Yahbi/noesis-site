# index.html, 404.html, all route pages and bundle.js are generated by
# build.sh but committed, because GitHub Pages serves this branch directly.
# Nothing otherwise stops source and artifacts drifting apart, which ships a
# stale site that looks fine in the diff. This rebuilds and fails on any change.
name: build-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install pinned Babel
        run: npm ci --no-audit --no-fund

      - name: Rebuild with the committed cache-bust stamp
        run: |
          python3 tools/rebuild_committed.py

      - name: Run inquiry and SEO regressions
        run: npm test

      - name: Fail if generated files drifted from source
        run: |
          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            git status --short
            git diff --stat
            echo ""
            echo "Generated files do not match source."
            echo "Run ./build.sh locally and commit the result."
            exit 1
          fi
          echo "artifacts match source"

      - name: Syntax-check the bundle
        run: |
          node --check bundle.js
          node --check route-meta.js
