        // the tab is visible (rAF runs). Hidden tabs freeze rAF, so we must not hide.
        if (window.gsap && window.ScrollTrigger && !rm && !document.hidden) {
          document.documentElement.classList.add("motion-ready");
        }
      } catch (e) {}
    })();
  </script>

  <!-- Cinematic preloader (removed by motion.js; auto-cleared after 6s as a safety net) -->
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader__inner">
      <div class="preloader__brand"><span class="preloader__word">NOESIS</span><span class="preloader__bar"></span></div>

    <div class="preloader__count">00</div>

  <script>
    /* Position the bronze branding bar across the O–E of the preloader wordmark
       (same measure as the nav logo) so the loading screen shows the real mark. */
    (function () {
      function place() {
        var word = document.querySelector('#preloader .preloader__word');
        var bar = document.querySelector('#preloader .preloader__bar');
        if (!word || !bar) return;
        var node = word.firstChild; if (!node) return;
        try {
          var r = document.createRange();
          var rc = function (i) { r.setStart(node, i); r.setEnd(node, i + 1); return r.getBoundingClientRect(); };
          var brand = word.parentElement.getBoundingClientRect();
          var o = rc(1), e = rc(2);
          if (!o.width || !e.width) return;
          bar.style.left = Math.round((o.left + o.right) / 2 - brand.left) + 'px';   // O centre
          bar.style.width = Math.round(e.right - (o.left + o.right) / 2) + 'px';      // → E right edge
          bar.style.opacity = '1';   // vertical alignment to the E's middle arm is handled in CSS
        } catch (err) {}
      }
      /* Only place once Jost is loaded, so the bar never appears on the fallback font's glyph metrics. */
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(place).catch(place);
      else place();
      window.addEventListener('resize', place);
    })();
  </script>
