  <!-- Motion stack: GSAP + ScrollTrigger + Lenis smooth-scroll + SplitType -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script src="https://unpkg.com/split-type@0.3.4/umd/index.min.js"></script>
  <script>
    /* Gate the "hide-before-reveal" CSS on motion actually being available,
       so a CDN failure or reduced-motion never leaves content invisible. */
    (function () {
      try {
        var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        // Only pre-hide content for the reveal animation when motion is available AND
        // the tab is visible (rAF runs). Hidden tabs freeze rAF, so we must not hide.
        if (window.gsap && window.ScrollTrigger && !rm && !document.hidden) {
          document.documentElement.classList.add("motion-ready");
        }
      } catch (e) {}
    })();
  </script>
